# End-to-end scan tests against simulated radios (mac80211_hwsim): one radio
# runs a hostapd access point, the other is scanned with scandump. No real
# Wi-Fi hardware is needed, but the runner's kernel must provide the hwsim
# module, so this is kept apart from the build and packaging checks in
# ci.yml. It runs on pull requests that change the scanner, and on demand.
name: Functional tests (hwsim)

on:
  pull_request:
    paths:
      - scandump.c
      - Makefile
      - tests/**
      - .github/workflows/functional.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hwsim:
    runs-on: ubuntu-latest
    env:
      SSID: scandump-ci
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkgconf libnl-3-dev libnl-genl-3-dev libpcap-dev \
            hostapd iw tcpdump libcap2-bin
      - run: make
      - name: Create two virtual radios and an access point
        run: |
          # The module is in linux-modules-extra on some runner kernels and
          # in the base modules on others; that package doesn't exist for
          # every kernel, so only install it if the module is missing.
          if ! modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo apt-get install -y -q --no-install-recommends \
              "linux-modules-extra-$(uname -r)" || true
          fi
          if modinfo mac80211_hwsim > /dev/null 2>&1; then
            sudo modprobe mac80211_hwsim radios=2
          else
            # Some runner kernels (6.17 azure) don't build it at all, but do
            # have mac80211, so build it from the upstream source of the
            # same version against the kernel's headers.
            sudo apt-get install -y -q --no-install-recommends \
              "linux-headers-$(uname -r)"
            src="$RUNNER_TEMP/hwsim"
            tag="v$(uname -r | cut -d. -f1,2)"
            mkdir -p "$src"
            for f in mac80211_hwsim.c mac80211_hwsim.h; do
              curl -fsSL -o "$src/$f" "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/net/wireless/virtual/$f?h=$tag"
            done
            echo 'obj-m := mac80211_hwsim.o' > "$src/Kbuild"
            make -C "/lib/modules/$(uname -r)/build" M="$src" modules
            sudo modprobe mac80211
            sudo insmod "$src/mac80211_hwsim.ko" radios=2
          fi
          iw dev
          printf '%s\n' interface=wlan0 driver=nl80211 "ssid=$SSID" \
            hw_mode=g channel=6 > "$RUNNER_TEMP/hostapd.conf"
          sudo hostapd -B "$RUNNER_TEMP/hostapd.conf"
          sudo ip link set wlan1 up
          sleep 2
      - name: Active scan to a file
        run: |
          sudo ./scandump -c 1 wlan1 active.pcap
          tcpdump -nn -e -r active.pcap | tee active.txt
          grep -q "Beacon ($SSID)" active.txt
      - name: Frequency-restricted scan
        run: |
          sudo ./scandump -c 1 -f 2437 wlan1 freq.pcap
          tcpdump -nn -r freq.pcap | grep -q "Beacon ($SSID)"
      - name: Passive scan
        run: |
          sudo ./scandump -c 1 --passive wlan1 passive.pcap
          tcpdump -nn -r passive.pcap | grep -q "Beacon ($SSID)"
      - name: Scans with an interval
        run: |
          start=$(date +%s)
          sudo ./scandump -c 3 -i 2 wlan1 interval.pcap
          elapsed=$(( $(date +%s) - start ))
          echo "3 scans in ${elapsed}s"
          # Two waits of 2 seconds between three scans, none after the last.
          test "$elapsed" -ge 4
          test "$(tcpdump -nn -r interval.pcap | grep -c "Beacon ($SSID)")" -eq 3
      - name: SIGTERM ends the wait between scans
        run: |
          sudo ./scandump -i 60 wlan1 term.pcap &
          # The file appears once the first scan is done; it is then waiting.
          for _ in $(seq 30); do [ -e term.pcap ] && break; sleep 1; done
          sleep 1
          sudo pkill -TERM -x scandump
          start=$(date +%s)
          wait $! && rc=0 || rc=$?
          test "$rc" -eq 0
          test $(( $(date +%s) - start )) -lt 10
          tcpdump -nn -r term.pcap | grep -q "Beacon ($SSID)"
      - name: Stream to standard output
        run: sudo ./scandump -c 1 wlan1 - | tcpdump -nn -r - | grep -q "Beacon ($SSID)"
      - name: Without privileges the scan is refused
        run: |
          if ./scandump -c 1 wlan1 denied.pcap 2> denied.err; then exit 1; fi
          cat denied.err
          grep -q 'Operation not permitted' denied.err
          test ! -e denied.pcap
      - name: CAP_NET_ADMIN file capability is enough
        run: |
          sudo setcap cap_net_admin+ep ./scandump
          ./scandump -c 1 wlan1 cap.pcap
          test "$(stat -c %U cap.pcap)" = "$(id -un)"
          tcpdump -nn -r cap.pcap | grep -q "Beacon ($SSID)"
